# Compensating control for backend LoginRateLimitFilter's documented DF-1 limitation: the
# backend keys its per-IP bucket on request.getRemoteAddr() only, which — once requests are
# proxied through this container — always resolves to nginx's own address, collapsing every
# client into one shared bucket (effectively disabling per-attacker IP throttling). nginx sees
# the real client peer address, so it enforces the per-IP limit that the backend no longer can.
# Rates approximate the backend's own auth-endpoint limits (application.yml
# nexus.security.rate-limit.*); this is deliberately a rough match, not an exact mirror — nginx's
# leaky-bucket algorithm differs from the backend's sliding window.
limit_req_zone $binary_remote_addr zone=auth_sensitive:10m rate=10r/m;
limit_req_status 429;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # style-src/font-src no longer allow Google Fonts since they are self-hosted. 'unsafe-inline' on style-src
    # is required because Angular Material injects inline <style> at runtime (CDK overlay,
    # ripples); Angular's CSP-nonce support (ngCspNonce) would let this be tightened later.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Auth-sensitive endpoints — per-IP throttled at the proxy (see limit_req_zone comment above).
    # nginx matches the longest prefix location regardless of declaration order, so this always
    # wins over the general /api/ block below for auth paths.
    location /api/v1/auth/ {
        limit_req zone=auth_sensitive burst=10 nodelay;
        proxy_pass http://backend:1000/api/v1/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-Id $http_x_correlation_id;
    }

    # Proxy API calls to the backend service (compose/k8s service name "backend")
    location /api/ {
        proxy_pass http://backend:1000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-Id $http_x_correlation_id;
    }

    # Hashed build artifacts are immutable — cache aggressively
    location ~* \.(?:js|css|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: every unknown route serves the shell, never cached
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
    }
}
