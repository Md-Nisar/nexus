# Security headers for every response of the edge (US-020 review H-1). nginx inherits server-level
# add_header directives only into a block that sets none of its own, so nginx.conf includes this
# snippet at the server level AND in every location that sets a header (Cache-Control). Installed
# as /etc/nginx/snippets/nexus-security-headers.conf by the Dockerfile; pinned by
# e2e/tools/tools.selftest.mjs and checked on the SPA shell and a static asset by the
# edge-etag-smoke CI job.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# style-src/font-src no longer allow Google Fonts since they are self-hosted. 'unsafe-inline' on style-src
# is required because Angular Material injects inline <style> at runtime (CDK overlay,
# ripples); Angular's CSP-nonce support (ngCspNonce) would let this be tightened later.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
