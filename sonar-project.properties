# SonarCloud Project Configuration
sonar.projectKey=Md-Nisar_nexus
sonar.organization=md-nisar

# Comma-separated paths to directories containing source files
sonar.sources=nexus-frontend/src,nexus-backend/src/main/java

# Comma-separated paths to directories containing test files
sonar.tests=nexus-frontend/src,nexus-backend/src/test/java
sonar.test.inclusions=**/*.spec.ts,**/*Test.java,**/*IT.java

# Coverage Report Paths
sonar.javascript.lcov.reportPaths=nexus-frontend/coverage/nexus-frontend/lcov.info
sonar.coverage.jacoco.xmlReportPaths=nexus-backend/target/site/jacoco/jacoco.xml

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/target/**
sonar.coverage.exclusions=**/*.spec.ts,**/*Test.java,**/*IT.java,**/main.ts
