# ---------------------------------------------------------------------------
# SonarQube Cloud - single project covering the Java (nexus-backend) and Angular (nexus-frontend) modules
# ---------------------------------------------------------------------------
sonar.projectKey=Md-Nisar_nexus
sonar.organization=md-nisar
sonar.projectName=nexus

# --- Sources -----------------------------------------------------------------
sonar.sources=nexus-frontend/src,nexus-backend/src/main/java
sonar.tests=nexus-frontend/src,nexus-backend/src/test/java
sonar.test.inclusions=**/*.spec.ts,**/*Test.java,**/*IT.java

sonar.sourceEncoding=UTF-8

# --- Java --------------------------------------------------------------------
sonar.java.binaries=nexus-backend/target/classes
sonar.java.test.binaries=nexus-backend/target/test-classes
sonar.coverage.jacoco.xmlReportPaths=nexus-backend/target/site/jacoco/jacoco.xml
sonar.junit.reportPaths=nexus-backend/target/surefire-reports

# --- TypeScript / Angular ----------------------------------------------------
sonar.javascript.lcov.reportPaths=nexus-frontend/coverage/nexus-frontend/lcov.info,nexus-frontend/coverage/lcov.info
sonar.typescript.tsconfigPaths=nexus-frontend/tsconfig.json

# --- Exclusions --------------------------------------------------------------
sonar.exclusions=\
  **/node_modules/**,\
  **/target/**,\
  **/dist/**,\
  **/*.generated.ts,\
  **/generated/**,\
  nexus-backend/src/main/resources/db/migration/**,\
  nexus-database/**

sonar.coverage.exclusions=\
  **/*.spec.ts,\
  **/*Test.java,\
  **/*IT.java,\
  **/main.ts,\
  **/environments/**,\
  **/*Application.java,\
  **/config/**,\
  **/dto/**
