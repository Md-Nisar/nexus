# Base configuration — shared by all profiles.
# Environment-specific values use ${ENV_VAR:default} — never hardcode secrets here.
spring:
  application:
    name: nexus-backend

  # Default profile for local development; override with SPRING_PROFILES_ACTIVE
  profiles:
    active: dev

  # Virtual threads: one-thread-per-request scalability without reactive complexity
  threads:
    virtual:
      enabled: true

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/nexus?useSSL=false&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}

  jpa:
    # Flyway owns the schema (ADR 0003) — Hibernate only validates it
    hibernate:
      ddl-auto: validate
    # Prevents lazy-loading from the view layer and connection hogging
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:1000}
  shutdown: graceful
  error:
    # Error bodies come exclusively from GlobalExceptionHandler (RFC 7807)
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

