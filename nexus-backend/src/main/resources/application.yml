# Base configuration — shared by all profiles.
# Environment-specific values use ${ENV_VAR:default} — never hardcode secrets here.
spring:
  application:
    name: nexus-backend

  # No profile is active by default — deployments MUST set SPRING_PROFILES_ACTIVE explicitly
  # (e.g. prod). Running with no profile omits application-dev.yml, so the dev placeholder crypto
  # keys and the seeded E2E test user are absent and IdentityCryptoConfig fails fast unless real
  # keys are supplied — i.e. a mis-configured deploy fails closed instead of silently running dev.
  # Local development uses the dev profile via the spring-boot-maven-plugin run config (pom.xml).

  # Virtual threads: one-thread-per-request scalability without reactive complexity
  threads:
    virtual:
      enabled: true

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/nexus?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}

  jpa:
    # Flyway owns the schema (ADR 0003) — Hibernate only validates it
    hibernate:
      ddl-auto: validate
    # Prevents lazy-loading from the view layer and connection hogging
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  mail:
    host: ${MAIL_HOST:}          # Required in staging/prod; dev overrides via application-dev.yml
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          starttls:
            enable: true         # SEC-4: enforce STARTTLS so plaintext SMTP cannot be used
            required: true       # SEC-4: reject connections that do not negotiate STARTTLS

server:
  port: ${SERVER_PORT:1000}
  shutdown: graceful
  error:
    # Error bodies come exclusively from GlobalExceptionHandler (RFC 7807)
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
      group:
        # US-008 T-08-12 (ADR 0012 §5): authEventDbPrivilege is a non-fatal security-observability
        # signal (detects DB-role drift away from the least-privilege nexus_app user, T-E2/T-T4),
        # not an availability signal. Spring Boot's liveness/readiness groups only include
        # livenessState/readinessState by default, so authEventDbPrivilege is already excluded —
        # these two lines make that exclusion explicit rather than relying on the implicit
        # default, so a future indicator addition to these groups doesn't silently sweep it in.
        # A drift is still visible on the full /actuator/health response and logged at WARN.
        liveness:
          include: livenessState
        readiness:
          include: readinessState

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# Identity context crypto material — REQUIRED in every Flyway-enabled environment.
# Missing key → fast-fail startup (IdentityCryptoConfig). Source from Vault/env vars in prod.
nexus:
  identity:
    encryption:
      password: ${NEXUS_IDENTITY_ENCRYPTION_PASSWORD}  # AES-256-GCM master password (>=16 chars)
      salt: ${NEXUS_IDENTITY_ENCRYPTION_SALT}          # hex-encoded KDF salt (>=32 hex chars)
    hmac-key: ${NEXUS_IDENTITY_HMAC_KEY}               # HMAC-SHA256 key for email blind index (>=32 bytes)
    # UUID of the default tenant injected into use-cases. Must be set in all non-smoke envs.
    default-tenant-id: ${NEXUS_IDENTITY_DEFAULT_TENANT_ID}
    argon2:
      # OWASP 2023 minimums (prod defaults). Override via env vars for speed in lower envs.
      memory-kb: ${NEXUS_ARGON2_MEMORY_KB:19456}
      iterations: ${NEXUS_ARGON2_ITERATIONS:2}
      parallelism: ${NEXUS_ARGON2_PARALLELISM:1}
    audit:
      # US-008 T-08-15 (design §4.1, ADR 0011) — in-process two-lane bounded retry buffer for
      # auth_events writes that fail their primary synchronous insert. Escape hatch: set enabled
      # to false to revert to synchronous-swallow-and-WARN-only (pre-US-008 behaviour, no
      # buffering, no scheduler). All defaults below are bound 1:1 to ADR 0011 §2 — do not change
      # a value here without updating that document.
      retry-buffer:
        enabled: true
        priority-capacity: 200     # LOCKOUT/TOKEN_REFRESH_REUSE/PASSWORD_CHANGED/ACCOUNT_LOCKED_WRITE_FAILED
        standard-capacity: 800     # everything else, incl. LOGIN_FAILURE
        drain-interval-ms: 10000   # @Scheduled(fixedDelay) — priority lane drained first each tick
        max-attempts: 5
        backoff-schedule: [1s, 5s, 30s, 2m, 10m]
        priority:
          depth-warn: 1            # any sustained priority-lane backlog is anomalous
          depth-critical: 180      # 90% of priority-capacity
          age-critical: 15m
        standard:
          depth-warn: 250          # 25% of standard-capacity
          depth-critical: 720      # 90% of standard-capacity
          age-critical: 15m
  jwt:
    private-key-pem: ${NEXUS_JWT_PRIVATE_KEY_PEM:}   # RSA-2048+ PKCS#8 PEM — required in prod; blank = ephemeral key in dev
    public-key-pem: ${NEXUS_JWT_PUBLIC_KEY_PEM:}     # RSA public key PEM — required in prod; derived from private key in dev
    access-token-ttl-seconds: 900
  security:
    rate-limit:
      store-type: memory    # memory | redis; redis requires nexus.redis.* config
      ip-max-attempts: 10        # AC-3: >10/min/IP rejected (LoginRateLimitFilter)
      ip-window-seconds: 60
      user-max-attempts: 5       # per-email-HMAC bucket (defense-in-depth, Gate 1 Q2=a)
      user-window-seconds: 900
      refresh-max-attempts: 30   # POST /api/v1/auth/refresh
      forgot-ip-max-attempts: 10  # POST /api/v1/auth/password/forgot — per-IP per ip-window-seconds
      reset-ip-max-attempts: 20   # POST /api/v1/auth/password/reset  — per-IP per ip-window-seconds
  mail:
    from-address: ${NEXUS_MAIL_FROM_ADDRESS:noreply@nexus.example.com}
  frontend:
    base-url: ${NEXUS_FRONTEND_BASE_URL:http://localhost:2000}

feature:
  nexus-us002-auth-registration:
    enabled: ${FEATURE_AUTH_REGISTRATION_ENABLED:false}  # Defaults off; enable per-env
  nexus-us003-auth-login:
    enabled: false  # Defaults off; enabled per-env via application-{profile}.yml

