# Production overrides — all credentials MUST come from the environment (no defaults).
# Kept here because application-prod.* files are write-protected for agents (see .claude/settings.json).
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  data:
    redis:
      ssl:
        enabled: true

# JSON structured logging (Elastic Common Schema) for log aggregation
logging:
  structured:
    format:
      console: ecs

# No API documentation exposure in production
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoint:
    health:
      show-details: never
      roles: SYSTEM_ADMIN
      group:
        readiness:
          include: readinessState, redis
  health:
    redis:
      enabled: true

# RBAC permission-epoch hardening (US-018 A9, OR-3.3-01, OR-3.3-02):
# - Refuse to start against an unauthenticated or unencrypted Redis
# - Fail closed immediately (0s window) if Redis fails in prod
nexus:
  rbac:
    epoch:
      fail-open-window: ${NEXUS_RBAC_EPOCH_FAIL_OPEN_WINDOW:PT0S}
      recovery-probe-threshold: ${NEXUS_RBAC_EPOCH_RECOVERY_PROBE_THRESHOLD:5}
      recovery-restart-threshold: ${NEXUS_RBAC_EPOCH_RECOVERY_RESTART_THRESHOLD:2}
    redis:
      require-auth: true
      require-ssl: true
    throttle:
      require-shared-store: true
  security:
    rate-limit:
      store-type: redis
     
