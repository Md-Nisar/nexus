# Production overrides — all credentials MUST come from the environment (no defaults).
# Kept here because application-prod.* files are write-protected for agents (see .claude/settings.json).
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  data:
    redis:
      ssl:
        enabled: true

# JSON structured logging (Elastic Common Schema) for log aggregation
logging:
  structured:
    format:
      console: ecs

# No API documentation exposure in production
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoint:
    health:
      show-details: never

# RBAC permission-epoch hardening (US-018 A9, OR-3.3-01): refuse to start against an unauthenticated or
# unencrypted Redis, so a misconfigured prod cannot silently fail open or transmit cleartext data.
nexus:
  rbac:
    redis:
      require-auth: true
      require-ssl: true
    throttle:
      require-shared-store: true
  security:
    rate-limit:
      store-type: redis
     
