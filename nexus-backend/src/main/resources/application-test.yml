# Test profile — activated by @ActiveProfiles("test") in *IT classes.
# Reduces Argon2 cost and rate-limit windows so tests run fast without sacrificing coverage.
feature:
  nexus-us002-auth-registration:
    enabled: true
  nexus-us003-auth-login:
    enabled: true

nexus:
  security:
    rate-limit:
      ip-max-attempts: 100       # high enough that the 5 lockout attempts aren't blocked by IP limit in ITs
      ip-window-seconds: 60
      user-max-attempts: 100     # same — lockout ITs drive account lockout via DB, not this filter
      user-window-seconds: 900
      refresh-max-attempts: 1000   # high so refresh-path ITs are not throttled
