# Local development overrides
spring:
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: false
  mail:
    host: localhost   # MailHog — docker compose up -d
    port: 1025        # MailHog SMTP port
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false   # MailHog does not support STARTTLS; override SEC-4 base setting for dev
            required: false

logging:
  level:
    com.example.nexus: DEBUG

# DEV ONLY — non-secret placeholder keys for local development without a vault.
# MUST NOT be used in shared, staging, or production environments.
nexus:
  identity:
    encryption:
      password: dev-not-a-secret-encryption-password
      salt: deadbeefdeadbeefdeadbeefdeadbeef
    hmac-key: dev-not-a-secret-hmac-key-min-32-bytes-long
    default-tenant-id: "00000000-0000-7000-8000-000000000001"
    argon2:
      # Reduced params for fast local iteration. NEVER use in staging or prod.
      memory-kb: 4096
      iterations: 1
      parallelism: 1

feature:
  nexus-us002-auth-registration:
    enabled: true
  nexus-us003-auth-login:
    enabled: true
