# Fast in-memory profile for context smoke tests only.
# Real integration tests (*IT) run against Testcontainers MySQL — see TESTING.md.
spring.datasource.url=jdbc:h2:mem:nexus
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
# Migrations are MySQL-flavoured SQL; they only run against real MySQL
spring.flyway.enabled=false
