name: Backend CI

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend-build:
    name: backend-build
    runs-on: ubuntu-latest

    env:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # CrossTenantPermissionIT (com.example.nexus.rbac.security) is the RBAC epic's only
      # end-to-end proof of the no-cross-tenant-privilege-escalation guarantee (EPIC-002,
      # US-011 T-010/T-014). This step MUST run the full Failsafe *IT suite (no -DskipITs,
      # no test exclusion covering rbac.security) — this job is a required, merge-blocking
      # status check on main specifically so that guarantee cannot regress silently.
      - name: Build, Test and Verify
        working-directory: nexus-backend
        run: |
          mvn -B clean verify \
            -Dspring.profiles.active=dev

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: nexus-backend/target/surefire-reports

      - name: Upload JaCoCo Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: nexus-backend/target/site/jacoco

      - name: Upload SpotBugs Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spotbugs-report
          path: nexus-backend/target/spotbugs*

  sonar:
    name: SonarQube Analysis
    if: ${{ vars.SONAR_ENABLED == 'true' }}
    needs: backend-build
    runs-on: ubuntu-latest

    permissions:
      contents: read



    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 1. Download Backend Coverage
      - name: Download JaCoCo Report
        uses: actions/download-artifact@v4
        with:
          name: jacoco-report
          path: nexus-backend/target/site/jacoco

      # 2. Generate Frontend Coverage
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: nexus-frontend/package-lock.json
          
      - name: Generate Frontend Coverage
        working-directory: nexus-frontend
        run: |
          npm ci
          npm run test:ci

      # 3. Unified SonarCloud Scan
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
