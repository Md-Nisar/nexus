name: Backend CI

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:
    branches:
      - main

jobs:
  backend-build:
    name: backend-build
    runs-on: ubuntu-latest

    env:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build, Test and Verify
        working-directory: nexus-backend
        run: mvn -B clean verify

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results
          path: nexus-backend/target/surefire-reports

      - name: Upload JaCoCo Report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: jacoco-report
          path: nexus-backend/target/site/jacoco

      - name: Upload SpotBugs Report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: spotbugs-report
          path: nexus-backend/target/spotbugs*

  sonar:
    # Enable by setting repository variable SONAR_ENABLED=true and adding
    # SONAR_TOKEN / SONAR_HOST_URL secrets
    if: ${{ vars.SONAR_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    needs: backend-build

    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Sonar Analysis
        working-directory: nexus-backend
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=nexus-backend
