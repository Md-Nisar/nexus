name: Performance Smoke

# Starts nexus-backend inside the runner and runs the k6 smoke tests against it. The tests
# themselves know nothing about GitHub Actions — this workflow only provides BASE_URL (and,
# optionally, credentials). See nexus-test/README.md.

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'nexus-test/performance-test/**'
      - '.github/workflows/performance-smoke.yml'

permissions:
  contents: read

concurrency:
  group: performance-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  performance-smoke:
    name: performance-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # Port 1000 (the app default) is privileged; the non-root runner user cannot bind it.
      SERVER_PORT: '8080'
      BASE_URL: http://localhost:8080
      TEST_ENV: ci
      K6_VERSION: v1.3.0
      # sha256 of k6-v1.3.0-linux-amd64.tar.gz, from the release's k6-v1.3.0-checksums.txt
      K6_SHA256: 84d26fc1f7bc03e02f2e016b3b1b20c032e05dfe461fca82de4e3a6ebe72ddbd
      # The app runs with the dev profile, whose DevDataInitializer seeds this pre-verified,
      # dev-only user (a documented, non-secret fixture). Repository secrets override it.
      PERF_USER_EMAIL: ${{ secrets.PERF_USER_EMAIL || 'test@example.com' }}
      PERF_USER_PASSWORD: ${{ secrets.PERF_USER_PASSWORD || 'TestPass99!' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: nexus-test/performance-test/package-lock.json

      - name: Install k6
        run: |
          curl -fsSL -o "$RUNNER_TEMP/k6.tar.gz" \
            "https://github.com/grafana/k6/releases/download/${K6_VERSION}/k6-${K6_VERSION}-linux-amd64.tar.gz"
          echo "${K6_SHA256}  $RUNNER_TEMP/k6.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/k6.tar.gz" -C "$RUNNER_TEMP"
          sudo mv "$RUNNER_TEMP/k6-${K6_VERSION}-linux-amd64/k6" /usr/local/bin/k6
          k6 version

      - name: Check and inspect performance tests
        working-directory: nexus-test/performance-test
        run: |
          npm ci
          npm run format:check
          npm run inspect

      # Quality gates are Backend CI's job; this build only needs a runnable jar.
      - name: Build application
        working-directory: nexus-backend
        run: mvn -B package -DskipTests -Dcheckstyle.skip -Dspotbugs.skip -Djacoco.skip

      - name: Start application
        run: |
          docker compose up -d --wait mysql redis
          # The compose healthcheck pings over the socket, which also answers during MySQL's
          # first-boot init (before it accepts TCP). Wait on TCP so Flyway can connect.
          timeout 120 bash -c 'until docker compose exec -T mysql \
            mysqladmin ping -h 127.0.0.1 -uroot -proot --silent; do sleep 2; done'
          cd nexus-backend
          SPRING_PROFILES_ACTIVE=dev nohup java -jar target/nexus-backend-*.jar \
            > "$RUNNER_TEMP/nexus-backend.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/nexus-backend.pid"

      - name: Wait for application readiness
        working-directory: nexus-test/performance-test
        run: |
          npm run wait-for-ready -- 180 || {
            {
              echo "backend process: $(pgrep -af '[j]ava -jar' || echo 'NOT RUNNING')"
              tail -n 60 "$RUNNER_TEMP/nexus-backend.log" || true
            } > "$RUNNER_TEMP/diagnostics.txt"
            cat "$RUNNER_TEMP/diagnostics.txt"
            # Also surface it as an annotation so it is visible on the run summary page.
            echo "::error title=Application not ready::$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' "$RUNNER_TEMP/diagnostics.txt")"
            exit 1
          }

      - name: Smoke test — platform health
        working-directory: nexus-test/performance-test
        env:
          K6_WEB_DASHBOARD: 'true'
          K6_WEB_DASHBOARD_EXPORT: results/smoke-platform-health.html
        run: npm run test:smoke

      - name: Smoke test — user profile (authenticated)
        working-directory: nexus-test/performance-test
        env:
          K6_WEB_DASHBOARD: 'true'
          K6_WEB_DASHBOARD_EXPORT: results/smoke-user-profile.html
        run: npm run test:smoke:user-profile

      - name: Smoke test — RBAC read
        working-directory: nexus-test/performance-test
        env:
          K6_WEB_DASHBOARD: 'true'
          K6_WEB_DASHBOARD_EXPORT: results/smoke-rbac-read.html
        run: npm run test:smoke:rbac-read

      - name: Smoke test — RBAC role lifecycle (writes)
        working-directory: nexus-test/performance-test
        env:
          K6_WEB_DASHBOARD: 'true'
          K6_WEB_DASHBOARD_EXPORT: results/smoke-rbac-role-lifecycle.html
        run: npm run test:smoke:rbac-role-lifecycle

      - name: Collect application log
        if: always()
        run: cp "$RUNNER_TEMP/nexus-backend.log" nexus-test/performance-test/results/ || true

      - name: Upload performance results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: performance-smoke-${{ github.sha }}
          path: nexus-test/performance-test/results
          retention-days: 30

      - name: Clean up
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/nexus-backend.pid" ]; then kill "$(cat "$RUNNER_TEMP/nexus-backend.pid")" || true; fi
          docker compose down -v
