name: Security Scan

on:
  schedule:
    # Weekly, Monday 03:00 UTC
    - cron: "0 3 * * 1"
  workflow_dispatch:

jobs:
  backend-dependencies:
    name: OWASP Dependency-Check (backend)
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"
          cache: maven
          
      - name: Cache OWASP Dependency-Check data
        uses: actions/cache@v4 
        with:
          path: ~/.dependency-check
          key: dependency-check-${{ runner.os }}-v1
          restore-keys: |
            dependency-check-${{ runner.os }}-
               
      - name: Run Dependency-Check
        working-directory: nexus-backend
        env:
          # Optional but strongly recommended — NVD throttles unauthenticated requests
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run:     mvn -B -Psecurity dependency-check:check \
                 -DskipTests \
                 -Ddependency-check.nvd.api.read-timeout=60000 \
                 -Ddependency-check.nvd.api.connect-timeout=60000 \
                -Ddependency-check.nvd.api.threads=4

      - name: Upload Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: nexus-backend/target/dependency-check-report.html

  frontend-dependencies:
    name: npm audit (frontend)
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Audit Production Dependencies
        working-directory: nexus-frontend
        run: npm audit --omit=dev --audit-level=high

  filesystem-scan:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Aqua Security Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
