name: AI Refactor (scheduled)

on:
  schedule:
    # Weekly, Monday 06:00 UTC.
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      provider:
        description: 'AI Model Provider'
        type: choice
        options:
          - gemini
          - openai
          - anthropic
        default: 'gemini'
      model:
        description: 'Model identifier (e.g. gemini-2.5-flash, gemini-2.5-pro, gpt-4o-mini, gpt-4o, claude-3-7-sonnet)'
        required: false
        default: 'gemini-2.5-flash'
      max_issues:
        description: 'Max Sonar issues to fix in this run'
        required: false
        default: '3'
      rule_filter:
        description: 'Optional comma-separated rule keys (defaults to Tier 1 allowlist)'
        required: false
        default: ''
      dry_run:
        description: 'Triage only, do not apply changes or open a PR'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ai-refactor
  cancel-in-progress: false

jobs:
  refactor:
    name: Propose low-risk fixes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Kill switch: set repo variable AI_REFACTOR_ENABLED=true to enable.
    if: vars.AI_REFACTOR_ENABLED == 'true'

    steps:
      # A GitHub App token is required: PRs opened with the default GITHUB_TOKEN
      # do NOT trigger pull_request workflows, so CI and the Sonar gate would
      # never run and the PR could never become mergeable.
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.AI_APP_ID }}
          private-key: ${{ secrets.AI_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: nexus-frontend/package-lock.json

      - name: Install frontend deps
        working-directory: nexus-frontend
        run: npm ci

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install AI runner dependencies
        run: pip install -r nexus-scripts/requirements-ai.txt

      # Deterministic fetch + filter. Pre-filters issues in bash before invoking model.
      - name: Fetch candidate Sonar issues
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_READ_TOKEN }}
          MAX_ISSUES: ${{ inputs.max_issues || '3' }}
          RULE_FILTER: ${{ inputs.rule_filter }}
        run: ./nexus-scripts/fetch_sonar_issues.sh > /tmp/candidates.json

      - name: Summarise candidates
        run: |
          echo '### Candidate issues' >> "$GITHUB_STEP_SUMMARY"
          jq -r '.[] | "- `\(.rule)` \(.component):\(.line // 0) - \(.message)"' \
            /tmp/candidates.json >> "$GITHUB_STEP_SUMMARY"
          echo "count=$(jq 'length' /tmp/candidates.json)" >> "$GITHUB_ENV"

      - name: Stop if nothing to do
        if: env.count == '0' || inputs.dry_run
        run: echo "Nothing to fix (or dry run). Exiting cleanly." && exit 0

      - name: Run multi-provider refactor agent
        if: env.count != '0' && !inputs.dry_run
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          BRANCH="ai/sonar-$(date -u +%Y%m%d)-${GITHUB_RUN_ID}"
          git config user.name  "nexus-ai-bot[bot]"
          git config user.email "nexus-ai-bot[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"

          python nexus-scripts/run_ai_refactor.py \
            --candidates /tmp/candidates.json \
            --provider "${{ inputs.provider || 'gemini' }}" \
            --model "${{ inputs.model || 'gemini-2.5-flash' }}" \
            --pr-body-out /tmp/pr-body.md

          if git diff --quiet; then
            echo "Agent produced no changes." && exit 0
          fi

          git add -A
          git commit -m "refactor(sonar): automated low-risk fixes

          Generated by ai-refactor workflow (${{ inputs.provider || 'gemini' }}), run ${GITHUB_RUN_ID}."
          git push origin "$BRANCH"
          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"

      - name: Open pull request
        if: env.BRANCH != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "refactor(sonar): automated low-risk fixes" \
            --body-file /tmp/pr-body.md \
            --label ai-refactor \
            --label needs-human-review
          # Deliberately no --auto-merge. A human merges. Always.
