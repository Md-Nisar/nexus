name: Backend CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-build:
    name: backend-build
    runs-on: ubuntu-latest

    env:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # CrossTenantPermissionIT (com.example.nexus.rbac.security) is the RBAC epic's only
      # end-to-end proof of the no-cross-tenant-privilege-escalation guarantee (EPIC-002,
      # US-011 T-010/T-014). This step MUST run the full Failsafe *IT suite (no -DskipITs,
      # no test exclusion covering rbac.security) — this job is a required, merge-blocking
      # status check on main specifically so that guarantee cannot regress silently.
      - name: Build, Test and Verify
        working-directory: nexus-backend
        run: |
          mvn -B clean verify \
            -Dspring.profiles.active=dev

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results
          path: nexus-backend/target/surefire-reports
          retention-days: 7

      - name: Upload JaCoCo Report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: jacoco-report
          path: nexus-backend/target/site/jacoco
          retention-days: 7

      - name: Upload SpotBugs Report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: spotbugs-report
          path: nexus-backend/target/spotbugs*
          retention-days: 7

  sonar:
    name: SonarQube Analysis
    if: ${{ vars.SONAR_ENABLED == 'true' }}
    needs: backend-build
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # 1. Download Backend Coverage
      - name: Download JaCoCo Report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: jacoco-report
          path: nexus-backend/target/site/jacoco

      # 2. Generate Frontend Coverage
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: nexus-frontend/package-lock.json
          
      - name: Generate Frontend Coverage
        working-directory: nexus-frontend
        run: |
          npm ci
          npm run test:ci

      # 3. Unified SonarCloud Scan
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@383f7e52eae3ab0510c3cb0e7d9d150bbaeab838 # v3.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
