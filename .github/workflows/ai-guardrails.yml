name: AI Guardrails

# Runs only on agent-authored PRs. This is the enforcement layer:
# Automated agents cannot edit this file (CODEOWNERS + settings.json deny),
# so these limits hold even if an agent misbehaves or is prompt-injected.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  guardrails:
    name: AI Guardrails
    runs-on: ubuntu-latest
    steps:
      - name: Skip if not an AI branch
        id: check
        run: |
          if [[ "${{ github.head_ref }}" == ai/* ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Not an ai/** branch - guardrails not applicable."
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: steps.check.outputs.run == 'true'
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: steps.check.outputs.run == 'true'
        with:
          python-version: '3.12'

      - name: Enforce diff budget and forbidden paths
        if: steps.check.outputs.run == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python nexus-scripts/check_guardrails.py
