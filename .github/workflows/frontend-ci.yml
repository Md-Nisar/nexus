name: Frontend CI

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:
    branches:
      - main

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-build:
    name: frontend-build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: nexus-frontend

    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: nexus-frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci --ignore-scripts

      - name: Check Formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Run Unit Tests with Coverage
        run: npm run test:ci

      - name: Build Production Application
        run: npm run build -- --configuration production

      - name: Upload Build Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-frontend-dist
          path: nexus-frontend/dist
          retention-days: 7

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    needs: frontend-build

    defaults:
      run:
        working-directory: nexus-frontend

    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: nexus-frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci --ignore-scripts

      - name: Cache Playwright Browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('nexus-frontend/package-lock.json') }}

      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx --no playwright install --with-deps chromium

      - name: Run E2E Tests
        run: npm run e2e

      - name: Upload Playwright Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: nexus-frontend/playwright-report
          retention-days: 7
